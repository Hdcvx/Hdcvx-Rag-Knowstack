services:
  app:
    build: .
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "echo > /dev/tcp/127.0.0.1/6333"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  qdrant_data:
  huggingface_cache:
